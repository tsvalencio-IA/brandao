name: Build static GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sigfrota-static-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Smoke test
        run: npm test

      - name: Build React/Vite
        run: npm run build

      - name: Skip stale build
        id: freshness
        shell: bash
        run: |
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Current main: $REMOTE_SHA"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer commit already exists on main. This old build will not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare branch-root site
        if: steps.freshness.outputs.publish == 'true'
        run: |
          test -f dist/app.html
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/app.html ./index.html
          cp dist/app.html ./404.html
          cp dist/manifest.webmanifest ./manifest.webmanifest
          cp dist/sw.js ./sw.js
          cp dist/sigfrota-icon.svg ./sigfrota-icon.svg
          if [ -f dist/Frotas-PM.apk ]; then cp dist/Frotas-PM.apk ./Frotas-PM.apk; fi
          touch .nojekyll

      - name: Commit compiled site
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets manifest.webmanifest sw.js sigfrota-icon.svg .nojekyll
          if [ -f Frotas-PM.apk ]; then git add Frotas-PM.apk; fi

          if git diff --cached --quiet; then
            echo "Static site already up to date."
            exit 0
          fi

          git commit -m "Build static SIGFROTA [skip ci]"

          # A second freshness check closes the small race window between build and push.
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          PARENT_SHA="$(git rev-parse HEAD^)"

          if [ "$REMOTE_SHA" != "$PARENT_SHA" ]; then
            echo "A newer commit arrived while this build was finishing."
            echo "Skipping this obsolete publish; the newer workflow will publish it."
            exit 0
          fi

          git push origin HEAD:main
