name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm install

      - name: Validate native APK contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIGFROTA-APP' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.statusBars()' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.navigationBars()' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.displayCutout()' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'view.setPadding(bars.left, bars.top, bars.right, bars.bottom)' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'onShowFileChooser' android/app/src/main/java/br/com/sigfrota/app/MainActivity.java
          grep -q 'android:icon="@drawable/ic_sigfrota_app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_sigfrota_app"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/drawable-nodpi/ic_sigfrota_app.jpg
          grep -q "image/.*,video/.*,.pdf" src/components/AttachmentField.jsx
          grep -q 'sigfrotaDebugUrl' android/app/build.gradle
          echo "Native APK contract validated."

      - name: Build delivery debug APK
        run: gradle -p android clean assembleDebug

      - name: Preserve delivery APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/SIGFROTA-TESTE.apk

      - name: Build isolated emulator APK
        run: gradle -p android clean assembleDebug -PsigfrotaUrl='http://127.0.0.1:4173/app.html#/'

      - name: Start isolated web app
        env:
          VITE_SETUP_MODE: 'true'
          VITE_APP_PUBLIC_URL: 'http://127.0.0.1:4173'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/sigfrota-vite.log 2>&1 &
          echo $! > /tmp/sigfrota-vite.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/app.html >/dev/null; then
              echo "Isolated Vite app is available."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sigfrota-vite.log
          exit 1

      - name: Install Android 35 emulator image
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sigfrota-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo "no" | avdmanager create avd --force --name sigfrota-ci --package "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/sigfrota-avds.txt
          grep -qx 'sigfrota-ci' /tmp/sigfrota-avds.txt

      - name: Install and open isolated APK in Android
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

          echo "Using ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/sigfrota-avds-before-start.txt
          grep -qx 'sigfrota-ci' /tmp/sigfrota-avds-before-start.txt

          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd sigfrota-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            > /tmp/sigfrota-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > /tmp/sigfrota-emulator.pid

          if ! timeout 180 adb wait-for-device; then
            echo "Emulator did not expose an ADB device within 180 seconds."
            cat /tmp/sigfrota-emulator.log || true
            ps -p "$EMULATOR_PID" -f || true
            exit 1
          fi

          BOOT_OK=0
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before Android finished booting."
              cat /tmp/sigfrota-emulator.log || true
              exit 1
            fi
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = "1" ]; then
              BOOT_OK=1
              break
            fi
            sleep 2
          done

          if [ "$BOOT_OK" != "1" ]; then
            echo "Android emulator did not finish booting within 240 seconds."
            adb devices -l || true
            cat /tmp/sigfrota-emulator.log || true
            exit 1
          fi

          adb reverse tcp:4173 tcp:4173
          adb reverse --list | tee /tmp/sigfrota-adb-reverse.txt
          grep -q 'tcp:4173 tcp:4173' /tmp/sigfrota-adb-reverse.txt

          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop br.com.sigfrota.app.teste
          adb shell am start -W -n br.com.sigfrota.app.teste/br.com.sigfrota.app.MainActivity | tee /tmp/sigfrota-am-start.txt
          sleep 8

          adb shell pm path br.com.sigfrota.app.teste | tee /tmp/sigfrota-package-path.txt
          adb shell pidof br.com.sigfrota.app.teste | tee /tmp/sigfrota-pid.txt
          test -s /tmp/sigfrota-pid.txt

          adb shell dumpsys activity top > /tmp/sigfrota-activity-top.txt
          grep -q 'br.com.sigfrota.app.teste' /tmp/sigfrota-activity-top.txt
          grep -q 'MainActivity' /tmp/sigfrota-activity-top.txt

          adb shell uiautomator dump /sdcard/sigfrota-window.xml
          adb pull /sdcard/sigfrota-window.xml /tmp/sigfrota-window.xml
          adb exec-out screencap -p > /tmp/sigfrota-apk.png

          test -s /tmp/sigfrota-window.xml
          test -s /tmp/sigfrota-apk.png

          if grep -qiE 'Webpage not available|ERR_CLEARTEXT_NOT_PERMITTED|net::ERR_' /tmp/sigfrota-window.xml; then
            echo "WebView error detected inside APK."
            cat /tmp/sigfrota-window.xml
            exit 1
          fi

          if grep -qi 'text="Entrar"' /tmp/sigfrota-window.xml; then
            echo "Unexpected login screen detected inside isolated APK."
            cat /tmp/sigfrota-window.xml
            exit 1
          fi

          grep -q 'Modo de configuração ativo' /tmp/sigfrota-window.xml
          echo "APK installed, MainActivity active, isolated SIGFROTA screen confirmed."

      - name: Upload APK smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIGFROTA-apk-smoke-evidence
          path: |
            /tmp/sigfrota-apk.png
            /tmp/sigfrota-window.xml
            /tmp/sigfrota-emulator.log
            /tmp/sigfrota-vite.log
            /tmp/sigfrota-am-start.txt
            /tmp/sigfrota-package-path.txt
            /tmp/sigfrota-pid.txt
            /tmp/sigfrota-activity-top.txt
            /tmp/sigfrota-adb-reverse.txt
          if-no-files-found: ignore

      - name: Publish tested APK in repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p public
          cp /tmp/SIGFROTA-TESTE.apk public/SIGFROTA-TESTE.apk
          git add public/SIGFROTA-TESTE.apk
          if git diff --cached --quiet; then
            echo "APK already published."
          else
            git commit -m "Publicar APK SIGFROTA para instalação [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGFROTA-debug-apk
          path: /tmp/SIGFROTA-TESTE.apk
