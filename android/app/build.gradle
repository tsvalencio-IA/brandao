plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.sigfrota.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.sigfrota.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'SIGFROTA_URL', '"https://sigfrota-kappa.vercel.app/"'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
