plugins {
    id 'com.android.application'
}

def sigfrotaDebugUrl = project.hasProperty('sigfrotaUrl')
    ? project.property('sigfrotaUrl').toString()
    : 'https://tsvalencio-ia.github.io/brandao/'

android {
    namespace 'br.com.sigfrota.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.sigfrota.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'SIGFROTA_URL', '"' + sigfrotaDebugUrl + '"'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'SIGFROTA_URL', '"https://tsvalencio-ia.github.io/brandao/"'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}

configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
